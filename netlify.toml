[build]
  publish = "site"

[dev]
  publish = "site"
  port = 8888

[[redirects]]
  from = "/Index.html"
  to = "/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
